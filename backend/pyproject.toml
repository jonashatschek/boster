[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boster-backend"
version = "0.1.0"
description = "Backend for Boster: analysis of Swedish apartment listings and housing cooperatives"
requires-python = ">=3.12"
# The app runs in the browser with Pyodide, which provides these packages
# (python-multipart is installed from PyPI by frontend/src/python/worker.ts).
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# PyMuPDF stands in for pdf.js when tests and scripts read PDFs on a desktop Python.
dev = ["pytest>=8", "httpx>=0.27", "pymupdf>=1.24"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
