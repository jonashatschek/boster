# Rules for the descriptive concern levels shown on the cooperative page.
#
# These are rules of thumb commonly used when Swedish buyers review a housing
# cooperative (bostadsrättsförening). They are NOT a credit rating, and a single
# indicator never decides the overall assessment on its own. Adjust freely.
#
# For each indicator:
#   direction          "higher_is_worse" or "lower_is_worse"
#   low_concern_until  values on the good side of this limit give "Låg risk"
#   high_concern_from  values on the bad side of this limit give "Hög risk"
#   values in between give "Måttlig risk"
#   rationale          shown to the user next to the rating

[indicators.debt_per_sqm_total_area]
direction = "higher_is_worse"
low_concern_until = 5000
high_concern_from = 10000
rationale = "Under 5 000 kr/kvm anses ofta som låg belåning och över 10 000 kr/kvm som hög. Nyproduktion har ofta högre belåning än äldre föreningar."

[indicators.savings_per_sqm]
direction = "lower_is_worse"
low_concern_until = 200
high_concern_from = 100
rationale = "Ett sparande under 100 kr/kvm räcker sällan till långsiktigt underhåll; 200 kr/kvm eller mer brukar anses sunt. Äldre hus med stora renoveringar framför sig behöver mer."

[indicators.interest_sensitivity_pct]
direction = "higher_is_worse"
low_concern_until = 5
high_concern_from = 10
rationale = "Visar hur mycket årsavgiften måste höjas om räntan stiger en procentenhet. Under 5 % ger låg känslighet, över 10 % hög."

[indicators.fee_share_of_revenue_pct]
direction = "lower_is_worse"
low_concern_until = 75
high_concern_from = 50
rationale = "En låg andel avgiftsintäkter betyder att föreningen är beroende av hyresintäkter från lokaler eller hyreslägenheter, som kan försvinna."

[indicators.interest_coverage_ratio]
direction = "lower_is_worse"
low_concern_until = 2
high_concern_from = 1.2
rationale = "Om rörelseöverskottet före avskrivningar bara täcker räntorna knappt finns lite marginal för räntehöjningar och underhåll. Underhållskostnader är redan avdragna från överskottet."

[indicators.short_term_debt_share_pct]
direction = "higher_is_worse"
low_concern_until = 30
high_concern_from = 60
rationale = "En stor andel lån som ska omförhandlas inom ett år ger kortsiktig exponering mot nya räntenivåer."

[overall]
# At least this many indicators must have a value, otherwise the overall result
# is "Otillräcklig information".
min_assessed_indicators = 3
# Overall "Hög risk" requires several warning signs, never just one.
high_when_high_count_at_least = 2
high_when_one_high_and_moderate_count_at_least = 2
# Overall "Måttlig risk" when there is one high or this many moderate indicators.
moderate_when_moderate_count_at_least = 2
